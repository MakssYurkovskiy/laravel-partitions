name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  COMPOSER_ROOT_VERSION: 1.0.x-dev

jobs:
  tests:
    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }} · ${{ matrix.dependencies }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.2', laravel: 12, testbench: '^10.0', dependencies: highest }
          - { php: '8.3', laravel: 12, testbench: '^10.0', dependencies: highest }
          - { php: '8.4', laravel: 12, testbench: '^10.0', dependencies: highest }
          - { php: '8.5', laravel: 12, testbench: '^10.0', dependencies: highest }
          - { php: '8.3', laravel: 13, testbench: '^11.0', dependencies: highest }
          - { php: '8.4', laravel: 13, testbench: '^11.0', dependencies: highest }
          - { php: '8.5', laravel: 13, testbench: '^11.0', dependencies: highest }
          - { php: '8.2', laravel: 12, testbench: '^10.0', dependencies: lowest }
          - { php: '8.3', laravel: 13, testbench: '^11.0', dependencies: lowest }

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Pin the framework to Laravel ${{ matrix.laravel }}
        run: |
          composer require --no-update --no-interaction \
            "illuminate/console:^${{ matrix.laravel }}.0" \
            "illuminate/container:^${{ matrix.laravel }}.0" \
            "illuminate/database:^${{ matrix.laravel }}.0" \
            "illuminate/support:^${{ matrix.laravel }}.0"
          composer require --dev --no-update --no-interaction \
            "orchestra/testbench:${{ matrix.testbench }}"

      - name: Install dependencies
        run: |
          composer update --prefer-dist --no-interaction --no-progress \
            ${{ matrix.dependencies == 'lowest' && '--prefer-lowest' || '' }}

      - name: Report the resolved versions
        run: composer show --direct

      - name: Run the test suite
        run: vendor/bin/phpunit

  validate:
    name: composer validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

  code-style:
    name: pint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Check the code style
        run: vendor/bin/pint --test

  static-analysis:
    name: phpstan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run the static analysis
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M

  integration:
    name: ${{ matrix.database.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        database:
          - { name: MySQL 8.0, image: 'mysql:8.0', driver: mysql }
          - { name: MySQL 8.4, image: 'mysql:8.4', driver: mysql }
          - { name: MariaDB 11.4, image: 'mariadb:11.4', driver: mariadb }

    services:
      database:
        image: ${{ matrix.database.image }}
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: partitions_test
        ports:
          - 3306:3306

    env:
      PARTITIONS_DB_HOST: 127.0.0.1
      PARTITIONS_DB_PORT: 3306
      PARTITIONS_DB_DRIVER: ${{ matrix.database.driver }}
      PARTITIONS_DB_DATABASE: partitions_test
      PARTITIONS_DB_USERNAME: root
      PARTITIONS_DB_PASSWORD: secret

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Wait for the server
        run: |
          for attempt in $(seq 1 30); do
            if php -r 'new PDO("mysql:host=127.0.0.1;port=3306;dbname=partitions_test", "root", "secret");' 2> /dev/null; then
              exit 0
            fi

            sleep 2
          done

          echo "::error::${{ matrix.database.name }} did not come up"
          exit 1

      - name: Run the suite against ${{ matrix.database.name }}
        run: vendor/bin/phpunit --testsuite Integration --fail-on-skipped
